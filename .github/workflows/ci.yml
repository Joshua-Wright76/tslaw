name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install Z3
        run: sudo apt-get update && sudo apt-get install -y z3 && z3 --version
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Check the examples with the built CLI
        run: node dist/cli.js check examples/tokens.law.ts examples/bank.law.ts

  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean (version pinned in proofs/lean-toolchain)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check the machine-checked core proofs
        run: cd proofs && lean Core.lean
