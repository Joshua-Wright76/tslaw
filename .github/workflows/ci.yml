name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Pinned solver releases: Ubuntu's packaged Z3 is years older and much weaker on
      # sequences and recursive definitions, which made verdicts depend on the runner.
      - name: Install Z3 and cvc5 (pinned, checksummed)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/solvers" && cd "$HOME/solvers"
          curl -sSfLo z3.zip https://github.com/Z3Prover/z3/releases/download/z3-5.4.1/z3-5.4.1-x64-glibc-2.39.zip
          echo "b548bac48ef2452b4e09ea2945cf4b011d5f43fcf39e4799df268ee7e0769d85  z3.zip" | sha256sum -c -
          curl -sSfLo cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-Linux-x86_64-static.zip
          echo "7eb18f8c814c36a46c5a7d003983e9cfbc4b0a9828d6dd596239291bd4cc61d8  cvc5.zip" | sha256sum -c -
          unzip -q z3.zip && unzip -q cvc5.zip
          echo "$HOME/solvers/z3-5.4.1-x64-glibc-2.39/bin" >> "$GITHUB_PATH"
          echo "$HOME/solvers/cvc5-Linux-x86_64-static/bin" >> "$GITHUB_PATH"
      - run: z3 --version && cvc5 --version | head -1
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Check the examples with the built CLI
        run: node dist/cli.js check examples/tokens.law.ts examples/bank.law.ts examples/math.law.ts examples/ledger.law.ts

  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean (version pinned in proofs/lean-toolchain)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check the machine-checked core proofs
        run: cd proofs && lean Core.lean

  # Publishes to npm when a commit on main carries a version that is not on npm yet, after
  # every other job has passed. Bumping "version" in package.json is what makes a release;
  # other merges leave npm alone. Authenticates with npm trusted publishing (OIDC), so there
  # is no token to store or leak, and npm attaches a provenance statement to each release.
  publish:
    needs: [test, proofs]
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the vX.Y.Z tag
      id-token: write # npm trusted publishing
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Use an npm with trusted publishing (11.5.1 or later)
        run: npm install -g npm@11.20.0 && npm --version
      - run: npm ci
      - run: npm run build
      - name: Is this version already on npm?
        id: check
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published; nothing to release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$version is new."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      # Tests already passed in the jobs above, so lifecycle scripts (which would rerun them
      # without Z3 here) are skipped.
      - name: Check what would be published
        run: npm pack --dry-run --ignore-scripts
      - name: Publish to npm
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.check.outputs.publish == 'true'
        run: npm publish --ignore-scripts
      - name: Tag the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.check.outputs.publish == 'true'
        run: |
          git tag "v${{ steps.check.outputs.version }}"
          git push origin "v${{ steps.check.outputs.version }}"
